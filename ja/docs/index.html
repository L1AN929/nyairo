  <script>
    (function () {
      var PALETTE_BG = {
        'deep-sea-sakura': { light: '#f5efea', dark: '#0c0b0d' },
        'forest-mint': { light: '#f4f1ea', dark: '#0a0e0d' },
        'burgundy-rosewood': { light: '#f7f1ee', dark: '#0d0a0c' },
        'iris-lilac': { light: '#f5f2f8', dark: '#0b0a10' },
        'glacier-porcelain': { light: '#f2f5f9', dark: '#0a0c10' },
        'berry-peach': { light: '#faf4f5', dark: '#0e0b0c' }
      };
      try {
        var saved = localStorage.getItem('nyairo-theme') || localStorage.getItem('chiyo-theme');
        var savedPal = localStorage.getItem('nyairo-palette');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
        if (savedPal && PALETTE_BG[savedPal]) {
          document.documentElement.setAttribute('data-palette', savedPal);
        }
        var activeTheme = (saved === 'light' || saved === 'dark') ? saved : 'light';
        var activePal = (savedPal && PALETTE_BG[savedPal]) ? savedPal : 'deep-sea-sakura';
        var metaTheme = document.getElementById('meta-theme-color');
        if (metaTheme) metaTheme.setAttribute('content', PALETTE_BG[activePal][activeTheme]);
      } catch (e) {}
    })();
  </script>
