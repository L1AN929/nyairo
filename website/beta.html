<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>页面已迁移 · nyairo</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('nyairo-theme') || localStorage.getItem('chiyo-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #141518;
      --card: #1b1d22;
      --line: rgba(255, 255, 255, 0.08);
      --line-2: rgba(255, 255, 255, 0.14);
      --fg: #e7e9ee;
      --fg-2: #a0a6b2;
      --muted: #767d8b;
      --accent-btn: #355e95;
      --accent-btn-hover: #3f6ca8;
      --accent-fg: #f3f7fd;
      --catchlight: inset 0 1px 0 rgba(255, 255, 255, 0.045);
      --shadow: 0 16px 40px rgba(0, 0, 0, 0.34);
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #eceef2;
      --card: #f6f7f9;
      --line: rgba(25, 32, 46, 0.08);
      --line-2: rgba(25, 32, 46, 0.14);
      --fg: #1d2026;
      --fg-2: #4a515e;
      --muted: #6c7482;
      --accent-btn: #365c91;
      --accent-btn-hover: #2c4e7e;
      --accent-fg: #f6f9fd;
      --catchlight: inset 0 1px 0 rgba(255, 255, 255, 0.78);
      --shadow: 0 14px 36px rgba(20, 28, 44, 0.075);
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .on-light { display: none; }
    .on-dark { display: block; }
    html[data-theme="light"] .on-dark { display: none; }
    html[data-theme="light"] .on-light { display: block; }
    .card {
      width: 100%;
      max-width: 460px;
      padding: 34px 32px 30px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--catchlight), var(--shadow);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 18px;
      color: var(--fg);
      text-decoration: none;
      font-weight: 640;
      font-size: 1rem;
      letter-spacing: -0.015em;
    }
    .brand img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 1.24rem;
      font-weight: 630;
      letter-spacing: -0.015em;
      color: var(--fg);
    }
    p {
      margin: 0 0 24px;
      font-size: 0.92rem;
      line-height: 1.7;
      color: var(--fg-2);
    }
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 40px;
      padding: 0 20px;
      border-radius: 980px;
      font-size: 0.87rem;
      font-weight: 560;
      text-decoration: none;
      transition: background 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.24s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn:active { transform: scale(0.985); }
    .btn-primary {
      background: var(--accent-btn);
      color: var(--accent-fg);
      border: 1px solid rgba(170, 204, 246, 0.22);
    }
    .btn-primary:hover {
      background: var(--accent-btn-hover);
      transform: translateY(-1px);
    }
    .btn-secondary {
      background: transparent;
      color: var(--fg-2);
      border: 1px solid var(--line-2);
    }
    .btn-secondary:hover {
      color: var(--fg);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <main class="card">
    <a href="./" class="brand" aria-label="nyairo 首页">
      <img class="on-dark" src="assets/nyairo-icon-light-66.webp" alt="" width="24" height="23">
      <img class="on-light" src="assets/nyairo-icon-66.webp" alt="" width="24" height="23">
      <span>nyairo</span>
    </a>
    <h1>早期测试页已并入首页</h1>
    <p>这个独立测试页不再单独维护。最新版本的桌面端下载、更新记录与完整上手指南，都已整理到官网首页。</p>
    <div class="actions">
      <a href="./" class="btn btn-primary">前往官网首页</a>
      <a href="./#changelog-v0-7-0" class="btn btn-secondary">v0.7.0 更新说明 →</a>
    </div>
  </main>
</body>
</html>
