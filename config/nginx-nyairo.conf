# www 子域 301 到主域名
server {
    listen 80;
    listen [::]:80;
    server_name www.nyairo.com;
    return 301 https://nyairo.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name nyairo.com;

    root /var/www/nyairo;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/nyairo.access.log;
    error_log  /var/log/nginx/nyairo.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Keep historical backup copies outside the public document namespace.
    location ~* (?:-backup|\.bak(?:$|/)|~$) {
        return 404;
    }

    # 核心 CSS 与 JS 脚本：开发与频繁迭代期绝对禁止 CDN 长缓存，每次必须跟源站 ETag 协商！
    location ~* \.(?:css|js|mjs)$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "no-cache, max-age=0" always;
        add_header CDN-Cache-Control "no-cache, max-age=0" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # 图片与字体等重度多媒体：允许缓存
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        expires 7d;
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # HTML 页面：命令 Cloudflare 边缘节点禁止任何长缓存，实时回源
    location ~* \.html?$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location ^~ /.well-known/ {
        allow all;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Cloudflare-CDN-Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
        access_log off;
    }
}
